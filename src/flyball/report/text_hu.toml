# WRFT 2023 – a prezentáció és a weboldal teljes magyar szövege.
#
# Minden szám helyőrző: {kulcs} vagy {kulcs|módosító|...}. A kulcsok a
# reports/phase5/key_numbers.json-ban vagy a flyball.report.numbers.derived()-ben vannak,
# a {dog.<név>.<oszlop>} alak a kutya-adatlapokból olvas. Számjegyet közvetlenül
# nem írunk a szövegbe (a teszt ezt ellenőrzi; kivétel: évszámok, „95%”, sorszámok).
# Módosítók: sign (előjel), pp (százalékpont), ci (95%-os tartomány zárójelben),
# d0–d3 (tizedesek), abs, nosign, nounit (mértékegység nélkül, hogy ragozható legyen:
# „{x|pp|nounit} százalékponttal”, „{y|nounit} mp-nél”).
#
# Nyelvi elvek: hétköznapi, magyaros mondatok; szakszó csak a függelékben, ott is
# magyarázattal. Egységes szóhasználat:
#   hibátlan futam (clean heat) · tiszta idő (a négy futás összege) · korai rajt · korai váltás ·
#   futási hiba · fejlesztési lehetőség (lever) · rangsor (impact ledger) · plusz győzelem ·
#   a divízió többi csapata (peers) · mezőny (minden más csapat) · felvezető (handler).
#
# Egy angol változathoz elég ezt a fájlt lecserélni (text_en.toml); a diagramok
# feliratai a flyball/plots/deck.py-ban vannak.

[meta]
title = "Wild Runners Flyball Team – a 2023-as szezon elemzése"
short_title = "WRFT 2023 – szezonelemzés"
subtitle = "Mitől nyerünk futamot, hol veszítünk, és mit tegyünk 2024-ben?"
audience = "Az edzőnek és a felvezetőknek"
date = "2026. október"
footer = "WRFT 2023 · szezonelemzés"
ci_note = "Zárójelben: a becslés 95%-os bizonytalansági tartománya"
pdf_name = "WRFT_2023_elemzes.pdf"
notes_name = "WRFT_2023_eloadoi_jegyzet.pdf"

[legend]
ci = "A számok utáni zárójeles tartomány a becslés 95%-os bizonytalansági tartománya: a valódi érték nagy valószínűséggel ebbe esik."
wins = "Plusz győzelem: ennyivel több futamot nyerne a WRFT egy szezonban más klubok csapatai ellen."

