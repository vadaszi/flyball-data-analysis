[[glossary]]
term = "Futam"
text = "Két csapat egy menete a rajttól a bíró sípjáig; egy mérkőzés több futamból áll."
[[glossary]]
term = "Hibátlan futam"
text = "Mind a négy kutya lefutott, nem volt hiba és újrafutás."
[[glossary]]
term = "Tiszta idő"
text = "A négy kutya futási idejének összege hibátlan futamban, a rajt és a váltások nélkül."
[[glossary]]
term = "Korai rajt"
text = "Az első kutya a zöld lámpa előtt lépi át a vonalat."
[[glossary]]
term = "Korai váltás"
text = "A következő kutya azelőtt lépi át a vonalat, hogy az előző visszaért volna."
[[glossary]]
term = "Futási hiba"
text = "Kihagyott akadály, kifutás vagy elejtett labda; újra kell futni."
[[glossary]]
term = "A divízió többi csapata"
text = "Azok a csapatok, amelyekkel a WRFT csapata ugyanazon a versenyen, ugyanabban a divízióban futott."
[[glossary]]
term = "Mezőny"
text = "Az összes többi, nem WRFT-csapat a 2023-as versenyeken."
[[glossary]]
term = "Elkerülhető vereség"
text = "Hiba miatt elvesztett futam, amelyet a csapat az aznapi szokásos tiszta idejével megnyert volna."
[[glossary]]
term = "Plusz győzelem"
text = "Ennyivel több futamot nyerne a WRFT egy szezonban más klubok ellen, ha a javaslat megvalósulna."
[[glossary]]
term = "Bizonytalansági tartomány"
text = "A számok után zárójelben: a becslés 95%-os tartománya. A valódi érték nagy valószínűséggel ebbe esik."
[[glossary]]
term = "Valódi (szignifikáns) különbség"
text = "Olyan eltérés, amely nem magyarázható a véletlennel. Mivel sok dolgot vizsgáltunk egyszerre, szigorúbb küszöböt (Holm-korrekció) alkalmaztunk."
[[glossary]]
term = "Korrigált arány"
text = "Kevés próbálkozásnál a kutya hibaarányát a csoportátlag felé igazítjuk, hogy egy-két véletlen hiba ne torzítson."
[[glossary]]
term = "Magasságadó kutya"
text = "Kis kutya, akinek a marmagassága miatt az egész csapat alacsonyabb akadályon fut."

